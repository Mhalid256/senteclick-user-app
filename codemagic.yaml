workflows:
  default-workflow:
    name: Default Workflow
    environment:
      flutter: stable
      java: 17
      android_signing:
        - senteclick   # ← use the exact name from the UI
    scripts:
      - flutter clean
      - flutter pub get
      - flutter build appbundle --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.aab