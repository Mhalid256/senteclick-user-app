workflows:
  default-workflow:
    name: Default Workflow
    environment:
      flutter: stable
      xcode: latest
      vars:
        GRADLE_OPTS: "-Xmx4g -Xms2g"
    scripts:
      - flutter pub get
      - flutter build appbundle --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk